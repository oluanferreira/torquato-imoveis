<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#285EA7"><title>Imóvel — Torquato Imóveis</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--p:#285EA7;--pd:#1c477f;--n:#0c1930;--bg:#f7f8fb;--mu:#687386;--ln:#e6eaf0}*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--n)}a{text-decoration:none;color:inherit}.shell{width:min(1180px,calc(100% - 36px));margin:auto}.top{background:#fff;border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:20}.nav{height:82px;display:flex;align-items:center;justify-content:space-between}.logo{width:235px}.back{font-weight:700;color:var(--p)}main{padding:38px 0 80px}.gallery{display:grid;grid-template-columns:1.7fr 1fr;grid-template-rows:260px 260px;gap:12px}.gallery img{width:100%;height:100%;object-fit:cover;border-radius:20px}.gallery img:first-child{grid-row:1/3}.head{display:grid;grid-template-columns:1.4fr .7fr;gap:40px;margin-top:34px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--p);font-weight:800}.head h1{font-family:'Playfair Display';font-size:52px;line-height:1.02;margin:10px 0 12px}.meta{color:var(--mu);font-size:14px}.features{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.feature{background:#fff;border:1px solid var(--ln);padding:12px 14px;border-radius:12px;font-size:13px}.description{color:var(--mu);line-height:1.8;max-width:760px}.side{background:#fff;border:1px solid var(--ln);border-radius:22px;padding:22px;height:max-content;position:sticky;top:105px}.price{font-size:28px;color:var(--p);font-weight:800;margin:8px 0}.secondary{font-size:14px;color:var(--mu);margin-bottom:20px}.cta{display:block;text-align:center;background:var(--p);color:white;padding:15px 18px;border-radius:999px;font-weight:800;margin-top:10px}.cta:hover{background:var(--pd)}.outline{background:white;color:var(--p);border:1px solid #bfd0e8}.notfound{text-align:center;padding:100px 20px}.notfound h1{font-family:'Playfair Display';font-size:48px}@media(max-width:800px){.gallery{grid-template-columns:1fr;grid-template-rows:340px 170px 170px}.gallery img:first-child{grid-row:auto}.head{grid-template-columns:1fr}.head h1{font-size:40px}.side{position:static}.logo{width:190px}}
</style></head><body><header class="top"><div class="shell nav"><a href="/"><img src="logo.svg" class="logo" alt="Torquato Imóveis"></a><a href="/#imoveis" class="back">← Voltar aos imóveis</a></div></header><main><div class="shell" id="content"></div></main><script src="properties.js"></script><script>
const id=new URLSearchParams(location.search).get('id');const p=(window.TORQUATO_PROPERTIES||[]).find(x=>x.id===id&&x.published);const c=document.getElementById('content');const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});if(!p){c.innerHTML='<div class="notfound"><h1>Imóvel não encontrado.</h1><p>Ele pode ter sido retirado do catálogo.</p><a class="cta" style="display:inline-block" href="/">Voltar ao site</a></div>'}else{document.title=p.title+' — Torquato Imóveis';const imgs=[p.image,...(p.gallery||[]).filter(x=>x!==p.image)].slice(0,3);while(imgs.length<3)imgs.push(p.image);const sale=p.salePrice?money(p.salePrice):'',rent=p.rent?money(p.rent)+'/mês':'';const price=p.purpose.includes('Venda')&&sale?sale:rent;const secondary=p.purpose.length>1&&sale&&rent?'Também para locação: '+rent:'';const msg=encodeURIComponent('Olá! Tenho interesse no imóvel '+p.id+' — '+p.title+'. Gostaria de mais informações.');c.innerHTML=`<div class="gallery">${imgs.map(i=>`<img src="${i}" alt="${p.title}">`).join('')}</div><div class="head"><div><div class="eyebrow">${p.type} • ${p.region} • Ref. ${p.id}</div><h1>${p.title}</h1><div class="meta">${p.address}</div><div class="features"><div class="feature">${p.area} m²</div>${p.bedrooms?`<div class="feature">${p.bedrooms} quartos</div>`:''}<div class="feature">${p.bathrooms} banheiros</div><div class="feature">${p.parking} vagas</div></div><p class="description">${p.description}</p></div><aside class="side"><div class="eyebrow">Valor</div><div class="price">${price}</div><div class="secondary">${secondary}</div><a class="cta" href="https://wa.me/?text=${msg}" target="_blank">Tenho interesse neste imóvel</a><a class="cta outline" href="/#imoveis">Ver outros imóveis</a></aside></div>`}
</script></body></html>
